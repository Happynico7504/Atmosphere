name: Fusee CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
    - uses: actions/checkout@v4
    
    - run: |
           cd fusee
           make -j8
           tar -c out $(find -name '*.elf' -o -name '*.lst') | gzip -9 > fusee.tar.gz

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: |
              fusee/fusee.tar.gz
